name: Build and Release YuziDPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Compile Resource and Binary (MSVC x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          rc.exe /nologo /I . /fo src\app.res src\app.rc
          cl.exe /nologo /std:c++17 /utf-8 /O2 /EHsc /MT /W3 /Fe:YuziDPI.exe src\main.cpp src\dpi_engine.cpp src\app.res /link /SUBSYSTEM:WINDOWS ws2_32.lib iphlpapi.lib winhttp.lib wininet.lib dwmapi.lib gdiplus.lib gdi32.lib user32.lib shell32.lib psapi.lib advapi32.lib comctl32.lib comdlg32.lib ole32.lib uuid.lib

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: YuziDPI.exe
          generate_release_notes: true
