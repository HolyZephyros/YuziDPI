name: Build and Release YuziDPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Compile Resource and Binary (MinGW-w64)
        shell: cmd
        run: |
          windres src\app.rc -O coff -o src\app_res.o
          g++ -O2 -std=c++17 -municode -mwindows src\main.cpp src\app_res.o -o YuziDPI.exe -lws2_32 -liphlpapi -lwininet -lwinhttp -lcomctl32 -lgdi32 -lole32 -luuid -lshell32 -lshlwapi -ladvapi32 -ldwmapi -luxtheme -lgdiplus -lpsapi -static -static-libgcc -static-libstdc++ -s

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: YuziDPI.exe
          generate_release_notes: true
