name: Build and Release YuziDPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Compile Resource and Binary (MinGW-w64)
        shell: cmd
        run: |
          if exist "C:\msys64\mingw64\bin" set "PATH=C:\msys64\mingw64\bin;%PATH%"
          windres src\app.rc -O coff -o src\app_res.o
          g++ -std=c++17 -O2 -static -mwindows -municode src\main.cpp src\dpi_engine.cpp src\app_res.o -o YuziDPI.exe -lws2_32 -liphlpapi -lwinhttp -lwininet -ldwmapi -lgdiplus -lgdi32 -luser32 -lshell32 -lpsapi -ladvapi32 -lcomctl32 -lcomdlg32 -lole32 -luuid

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: YuziDPI.exe
          generate_release_notes: true
